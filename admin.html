<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Mount It Right</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF; --mist:#F5F5F6; --ink:#0A0A0C; --ink-soft:#6B6B70;
    --line: rgba(10,10,12,0.09); --signal:#2F5EFF; --signal-soft: rgba(47,94,255,0.08);
    --level:#2FB37C; --warn:#BA7517; --danger:#A32D2D;
    --display:'Inter Tight',sans-serif; --body:'Inter',sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--mist); color:var(--ink); font-family:var(--body); line-height:1.5; padding:24px; }
  h1{ font-family:var(--display); font-size:22px; margin-bottom:4px; }
  .sub{ color:var(--ink-soft); font-size:13.5px; margin-bottom:24px; }
  .card{ background:var(--paper); border-radius:16px; padding:24px; margin-bottom:20px; border:1px solid var(--line); }

  /* login */
  #loginCard{ max-width:360px; margin:80px auto; text-align:center; }
  #loginCard input{
    width:100%; padding:14px 16px; font-size:16px; border:1.5px solid var(--line);
    border-radius:12px; margin:16px 0; background:var(--mist);
  }
  #loginCard button, .btn{
    background:var(--ink); color:var(--paper); border:none; font-weight:600; font-size:14.5px;
    padding:12px 22px; border-radius:100px; cursor:pointer;
  }
  #loginError{ color:var(--danger); font-size:13px; margin-top:8px; min-height:16px; }

  /* layout */
  #app{ display:none; max-width:960px; margin:0 auto; }
  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
  .btn-secondary{ background:var(--mist); color:var(--ink); border:1.5px solid var(--line); font-weight:600; font-size:13.5px; padding:10px 16px; border-radius:100px; cursor:pointer; }
  .btn-secondary:hover{ border-color:var(--ink-soft); }

  .filters{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .filters button{
    background:var(--mist); border:1.5px solid var(--line); border-radius:100px; padding:7px 14px;
    font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer;
  }
  .filters button.active{ background:var(--signal-soft); border-color:var(--signal); color:var(--signal); }

  table{ width:100%; border-collapse:collapse; }
  th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); padding:10px 8px; border-bottom:1.5px solid var(--line); }
  td{ padding:12px 8px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:top; }
  tr:last-child td{ border-bottom:none; }
  .price{ font-family:var(--mono); font-weight:600; }
  .badge{ display:inline-block; padding:3px 9px; border-radius:100px; font-size:11px; font-weight:700; text-transform:uppercase; }
  .badge.new{ background:var(--signal-soft); color:var(--signal); }
  .badge.confirmed{ background:rgba(47,179,124,0.12); color:var(--level); }
  .badge.completed{ background:var(--mist); color:var(--ink-soft); }
  .badge.cancelled{ background:rgba(163,45,45,0.1); color:var(--danger); }
  .src{ font-size:11px; color:var(--ink-soft); font-family:var(--mono); }
  .row-actions{ display:flex; gap:6px; flex-wrap:wrap; }
  .row-actions button{
    background:none; border:1px solid var(--line); border-radius:8px; padding:5px 9px;
    font-size:11.5px; cursor:pointer; color:var(--ink-soft);
  }
  .row-actions button:hover{ border-color:var(--ink-soft); color:var(--ink); }
  .row-actions button.danger:hover{ border-color:var(--danger); color:var(--danger); }
  .empty{ text-align:center; padding:40px; color:var(--ink-soft); }

  /* modal */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(10,10,12,0.4);
    align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal{ background:var(--paper); border-radius:16px; padding:28px; max-width:420px; width:100%; max-height:88vh; overflow-y:auto; }
  .modal h2{ font-family:var(--display); font-size:18px; margin-bottom:18px; }
  .field-row{ margin-bottom:12px; }
  .field-row label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
  .field-row input, .field-row select, .field-row textarea{
    width:100%; padding:11px 12px; font-size:14px; border:1.5px solid var(--line);
    border-radius:10px; background:var(--mist); font-family:var(--body);
  }
  .field-row.two{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .btn-cancel{ background:none; border:none; color:var(--ink-soft); font-weight:600; font-size:14px; cursor:pointer; }
</style>
</head>
<body>

<div id="loginCard" class="card">
  <h1>Admin</h1>
  <p class="sub">Enter your admin password to continue.</p>
  <input type="password" id="pwInput" placeholder="Password" autocomplete="off">
  <button onclick="login()">Enter</button>
  <div id="loginError"></div>
</div>

<div id="app">
  <div class="toolbar">
    <div>
      <h1>Bookings</h1>
      <p class="sub">Mount It Right — admin</p>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn-secondary" onclick="loadBookings()">Refresh</button>
      <button class="btn" onclick="openAddModal()">+ Add booking</button>
    </div>
  </div>

  <div class="filters" id="filters">
    <button data-filter="all" class="active">All</button>
    <button data-filter="new">New</button>
    <button data-filter="confirmed">Confirmed</button>
    <button data-filter="completed">Completed</button>
    <button data-filter="cancelled">Cancelled</button>
  </div>

  <div class="card" style="padding:0; overflow-x:auto;">
    <table id="table">
      <thead>
        <tr>
          <th>When</th><th>Customer</th><th>Address</th><th>Total</th><th>Status</th><th>Source</th><th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none;">No bookings yet.</div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>Add a booking</h2>
    <div class="field-row">
      <label>Source</label>
      <select id="f-source">
        <option value="phone">Phone call</option>
        <option value="manual">Manual entry</option>
      </select>
    </div>
    <div class="field-row two">
      <div>
        <label>Name</label>
        <input type="text" id="f-name" placeholder="Full name">
      </div>
      <div>
        <label>Phone</label>
        <input type="tel" id="f-phone" placeholder="(602) 555-0110">
      </div>
    </div>
    <div class="field-row">
      <label>Address</label>
      <input type="text" id="f-address" placeholder="Street address, city">
    </div>
    <div class="field-row two">
      <div>
        <label>Date</label>
        <input type="date" id="f-date">
      </div>
      <div>
        <label>Time</label>
        <input type="text" id="f-time" placeholder="9:00 AM">
      </div>
    </div>
    <div class="field-row">
      <label>Total price ($)</label>
      <input type="number" id="f-total" placeholder="149">
    </div>
    <div class="field-row">
      <label>Notes</label>
      <textarea id="f-notes" rows="2" placeholder="Anything worth remembering"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAddModal()">Cancel</button>
      <button class="btn" onclick="submitAddBooking()">Save booking</button>
    </div>
  </div>
</div>

<script>
  let adminKey = sessionStorage.getItem('adminKey') || '';
  let allBookings = [];
  let activeFilter = 'all';

  function login(){
    const pw = document.getElementById('pwInput').value;
    if(!pw){ return; }
    adminKey = pw;
    testAuthThenEnter();
  }

  async function testAuthThenEnter(){
    try{
      const res = await fetch('/api/bookings', { headers: { 'X-Admin-Key': adminKey } });
      if(res.status === 401){
        document.getElementById('loginError').textContent = 'Wrong password.';
        return;
      }
      sessionStorage.setItem('adminKey', adminKey);
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      const data = await res.json();
      allBookings = data.bookings || [];
      render();
    } catch(err){
      document.getElementById('loginError').textContent = 'Could not reach the server. Try again.';
    }
  }

  if(adminKey) testAuthThenEnter();

  async function loadBookings(){
    const res = await fetch('/api/bookings', { headers: { 'X-Admin-Key': adminKey } });
    if(res.status === 401){ sessionStorage.removeItem('adminKey'); location.reload(); return; }
    const data = await res.json();
    allBookings = data.bookings || [];
    render();
  }

  document.getElementById('filters').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-filter]');
    if(!btn) return;
    activeFilter = btn.dataset.filter;
    [...document.querySelectorAll('#filters button')].forEach(b => b.classList.toggle('active', b === btn));
    render();
  });

  function render(){
    const tbody = document.getElementById('tbody');
    const filtered = activeFilter === 'all' ? allBookings : allBookings.filter(b => b.status === activeFilter);

    document.getElementById('emptyState').style.display = filtered.length ? 'none' : 'block';

    tbody.innerHTML = filtered.map(b => `
      <tr>
        <td>${b.booking_date ? b.booking_date + (b.booking_time ? ' · ' + b.booking_time : '') : '<span style="color:var(--ink-soft)">Not scheduled</span>'}</td>
        <td>${escapeHtml(b.name || '—')}<br><span class="src">${escapeHtml(b.phone || '')}</span></td>
        <td>${escapeHtml(b.address || '—')}</td>
        <td class="price">$${b.total_price ?? 0}</td>
        <td><span class="badge ${b.status}">${b.status}</span></td>
        <td><span class="src">${b.source}</span></td>
        <td>
          <div class="row-actions">
            ${b.status !== 'confirmed' ? `<button onclick="updateStatus(${b.id},'confirmed')">Confirm</button>` : ''}
            ${b.status !== 'completed' ? `<button onclick="updateStatus(${b.id},'completed')">Complete</button>` : ''}
            ${b.status !== 'cancelled' ? `<button onclick="updateStatus(${b.id},'cancelled')">Cancel</button>` : ''}
            <button class="danger" onclick="deleteBooking(${b.id})">Delete</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  async function updateStatus(id, status){
    await fetch(`/api/bookings/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
      body: JSON.stringify({ status }),
    });
    loadBookings();
  }

  async function deleteBooking(id){
    if(!confirm('Delete this booking permanently?')) return;
    await fetch(`/api/bookings/${id}`, {
      method: 'DELETE',
      headers: { 'X-Admin-Key': adminKey },
    });
    loadBookings();
  }

  function openAddModal(){
    document.getElementById('modalOverlay').classList.add('show');
  }
  function closeAddModal(){
    document.getElementById('modalOverlay').classList.remove('show');
  }

  async function submitAddBooking(){
    const payload = {
      source: document.getElementById('f-source').value,
      name: document.getElementById('f-name').value || null,
      phone: document.getElementById('f-phone').value || null,
      address: document.getElementById('f-address').value || null,
      date: document.getElementById('f-date').value || null,
      time: document.getElementById('f-time').value || null,
      total: Number(document.getElementById('f-total').value) || 0,
      notes: document.getElementById('f-notes').value || null,
    };
    await fetch('/api/bookings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
      body: JSON.stringify(payload),
    });
    closeAddModal();
    loadBookings();
  }
</script>

</body>
</html>
