<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup — Mount It Right</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#FFFFFF; --mist:#F5F5F6; --ink:#0A0A0C; --ink-soft:#6B6B70; --line:rgba(10,10,12,0.09); --signal:#2F5EFF; --level:#2FB37C; --danger:#A32D2D; --display:'Inter Tight',sans-serif; --body:'Inter',sans-serif; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--mist); color:var(--ink); font-family:var(--body); padding:24px; }
  .card{ max-width:400px; margin:60px auto; background:var(--paper); border-radius:20px; padding:32px; border:1px solid var(--line); }
  h1{ font-family:var(--display); font-size:20px; margin-bottom:6px; }
  .sub{ color:var(--ink-soft); font-size:13.5px; margin-bottom:24px; }
  label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin:14px 0 5px; }
  input{ width:100%; padding:12px 14px; font-size:15px; border:1.5px solid var(--line); border-radius:10px; background:var(--mist); }
  button{ width:100%; margin-top:22px; background:var(--ink); color:var(--paper); border:none; font-weight:600; font-size:14.5px; padding:14px; border-radius:100px; cursor:pointer; }
  #msg{ margin-top:16px; font-size:13.5px; text-align:center; display:none; }
  #msg.ok{ color:var(--level); display:block; }
  #msg.err{ color:var(--danger); display:block; }
</style>
</head>
<body>

<div class="card">
  <h1>Create your admin account</h1>
  <p class="sub">This only works once — while there are zero accounts on the site. After you create yours, this page stops working on its own.</p>

  <label>Full name</label>
  <input type="text" id="name" placeholder="Your name">

  <label>Email</label>
  <input type="email" id="email" placeholder="you@example.com">

  <label>Phone (optional, for login too)</label>
  <input type="tel" id="phone" placeholder="+16025550110">

  <label>Password</label>
  <input type="password" id="password" placeholder="Choose a strong password">

  <button onclick="submitSetup()">Create admin account</button>
  <div id="msg"></div>
</div>

<script>
  async function submitSetup(){
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('msg');

    if(!name || !password || (!email && !phone)){
      msg.textContent = 'Fill in name, password, and at least email or phone.';
      msg.className = 'err';
      return;
    }

    try{
      const res = await fetch('/api/setup/init-admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email: email || null, phone: phone || null, password }),
      });
      const data = await res.json();
      if(data.ok){
        msg.textContent = 'Admin account created! You can now log in at /admin.html.';
        msg.className = 'ok';
      } else {
        msg.textContent = data.error || 'Something went wrong.';
        msg.className = 'err';
      }
    } catch(err){
      msg.textContent = 'Could not reach the server.';
      msg.className = 'err';
    }
  }
</script>

</body>
</html>
